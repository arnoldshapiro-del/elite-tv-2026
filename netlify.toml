# Present from the start so the Aug 1, 2026 Netlify hookup is connect-only.
# Static single-file site: nothing to build, just publish the repo root.

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# The app calls /api/discover and /api/movies on both hosts. Vercel routes those
# to api/*.js natively; Netlify needs these redirects to its own functions.
[[redirects]]
  from = "/api/discover"
  to = "/.netlify/functions/discover"
  status = 200
  force = true

[[redirects]]
  from = "/api/movies"
  to = "/.netlify/functions/movies"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
