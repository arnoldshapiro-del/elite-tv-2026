# Present from the start so the Aug 1, 2026 Netlify hookup is connect-only.
# Static single-file site: nothing to build, just publish the repo root.

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# "Find New Shows" calls /api/discover on both hosts. Vercel routes that to
# api/discover.js natively; Netlify needs this redirect to its own function.
[[redirects]]
  from = "/api/discover"
  to = "/.netlify/functions/discover"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
